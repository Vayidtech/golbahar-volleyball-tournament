<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت | مسابقات والیبال گلبهار</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="js/admin-part0.js"></script>
<script src="js/admin-part1.js"></script>
<script src="js/admin-part2.js"></script>
<script src="js/admin-join.js"></script>
</head>
<body style="font-family:Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8fafc">
<div id="boot" style="text-align:center;color:#64748b">
<div style="width:40px;height:40px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite"></div>
در حال بارگذاری...
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
(function(){
  try {
    var bin = Uint8Array.from(atob(window.__GB_B64), function(c){return c.charCodeAt(0);});
    var html = pako.ungzip(bin, {to:"string"});
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.getElementById("boot").innerHTML = "خطا: " + e.message;
  }
})();
</script>
</body>
</html>
