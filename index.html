<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقات والیبال گلبهار</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body style="font-family:Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8fafc">
<div id="boot" style="text-align:center;color:#64748b">
<div style="width:40px;height:40px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite"></div>
در حال بارگذاری...
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
(async function () {
  try {
    var parts = await Promise.all([0,1,2].map(function(i){
      return fetch('js/app' + i + '.b64?t=' + Date.now()).then(function(r){
        if (!r.ok) throw new Error('load part ' + i + ' (' + r.status + ')');
        return r.text();
      });
    }));
    // fix truncated endings from git push (app1 missing t, app2 missing =)
    var fix = await fetch('js/app-fix.txt?t=' + Date.now()).then(function(r){ return r.ok ? r.text() : 't='; }).catch(function(){ return 't='; });
    parts[1] = parts[1].replace(/\s+/g,'');
    parts[2] = parts[2].replace(/\s+/g,'');
    if (parts[1].length === 9999) parts[1] += fix.charAt(0);
    if (parts[2].length === 7051) parts[2] += fix.charAt(1) || '=';
    var b64 = parts.join('').replace(/\s+/g,'');
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var html = pako.ungzip(bin, { to: 'string' });
    if (location.hash === '#admin' && sessionStorage.getItem('golbahar_admin_ok') === '1') {
      html = html.replace('</body>', '<script>setTimeout(function(){ try { isAdminLoggedIn=true; var p=document.getElementById("view-public"); var a=document.getElementById("view-admin"); if(p)p.classList.add("hidden"); if(a)a.classList.remove("hidden"); if(typeof switchAdminSubtab==="function")switchAdminSubtab("config"); } catch(e){} }, 700);<\/script></body>');
    }
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('boot').innerHTML = 'خطا: ' + e.message + '<br>صفحه را رفرش کنید';
  }
})();
</script>
</body>
</html>
