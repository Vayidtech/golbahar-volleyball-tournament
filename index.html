<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>مسابقات والیبال گلبهار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
    body { background: linear-gradient(160deg, #e0f2fe 0%, #f0f9ff 40%, #dbeafe 100%); min-height: 100vh; color: #1e293b; }
    .card { background: rgba(255,255,255,0.92); border: 1px solid #bfdbfe; box-shadow: 0 4px 20px rgba(59,130,246,0.08); }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    .btn-primary:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
    .logo-preview { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: #f1f5f9; }
    .team-chip { cursor: grab; user-select: none; }
    .team-chip:active { cursor: grabbing; transform: scale(1.03); }
    .drop-zone { min-height: 70px; transition: background 0.2s; }
    .drop-zone.drag-over { background: #dbeafe; border-color: #3b82f6 !important; }
    .tab-active { background: #3b82f6; color: white; }
    .news-item { border-right: 4px solid #3b82f6; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, createContext, useContext } = React;
    const ADMIN_PASSWORD = "golbahar1404";
    const STORAGE_KEY = "golbahar_volleyball_v2";
    const loadData = () => { try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e){} return getDefaultData(); };
    const saveData = d => localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    const getDefaultData = () => ({ config: { numTeams:20, teamsPerGroup:4, numGroups:5, advancePerGroup:2, bestSeconds:2 }, teams:[], groups:[], matches:[], news:[], knockout:{ advancedFromGroups:[], advancedFromLosers:[] }, stage:"setup" });
    const TournamentContext = createContext(null);
    function TournamentProvider({ children }) {
      const [data, setData] = useState(() => loadData());
      const [isAdmin, setIsAdmin] = useState(false);
      useEffect(() => { saveData(data); }, [data]);
      const update = u => setData(p => typeof u === "function" ? u(p) : u);
      return <TournamentContext.Provider value={{ data, update, isAdmin, setIsAdmin }}>{children}</TournamentContext.Provider>;
    }
    const useTournament = () => useContext(TournamentContext);
    const calcStandings = (teams, matches, groupId) => {
      const gt = teams.filter(t => t.groupId === groupId);
      const stats = {};
      gt.forEach(t => { stats[t.id] = { team:t, played:0, wins:0, losses:0, setsWon:0, setsLost:0, points:0, setDiff:0 }; });
      matches.filter(m => m.groupId === groupId && m.score1 != null && m.score2 != null).forEach(m => {
        const s1 = stats[m.team1Id], s2 = stats[m.team2Id]; if (!s1||!s2) return;
        s1.played++; s2.played++; s1.setsWon += m.score1; s1.setsLost += m.score2; s2.setsWon += m.score2; s2.setsLost += m.score1;
        if (m.score1 > m.score2) { s1.wins++; s2.losses++; if (m.score1===2&&m.score2===0) s1.points+=3; else { s1.points+=2; s2.points+=1; } }
        else { s2.wins++; s1.losses++; if (m.score2===2&&m.score1===0) s2.points+=3; else { s2.points+=2; s1.points+=1; } }
        s1.setDiff = s1.setsWon - s1.setsLost; s2.setDiff = s2.setsWon - s2.setsLost;
      });
      return Object.values(stats).sort((a,b) => b.points-a.points || b.setDiff-a.setDiff || b.setsWon-a.setsWon || a.team.name.localeCompare(b.team.name,"fa"));
    };
    const generateId = () => Math.random().toString(36).slice(2,11);
    const todayStr = () => new Date().toISOString().slice(0,10);

    function Header({ page, setPage }) {
      const { isAdmin, setIsAdmin } = useTournament();
      return (
        <header className="bg-white/90 backdrop-blur border-b border-blue-100 sticky top-0 z-50 shadow-sm">
          <div className="max-w-6xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
            <button onClick={() => setPage("home")} className="flex items-center gap-2 min-w-0">
              <div className="w-9 h-9 rounded-full bg-blue-500 flex items-center justify-center text-lg shrink-0">🏐</div>
              <div className="text-right min-w-0"><h1 className="font-bold text-sm sm:text-base text-slate-800 truncate">مسابقات والیبال گلبهار</h1></div>
            </button>
            <nav className="flex items-center gap-1.5 shrink-0">
              <button onClick={() => setPage("home")} className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm ${page==="home"||page==="team"?"bg-blue-100 text-blue-700":"text-slate-600 hover:bg-slate-100"}`}>خانه</button>
              {isAdmin ? (<>
                <button onClick={() => setPage("admin")} className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm ${page==="admin"?"bg-blue-500 text-white":"bg-blue-50 text-blue-600"}`}>ادمین</button>
                <button onClick={() => { setIsAdmin(false); setPage("home"); }} className="px-2.5 py-1.5 rounded-lg text-xs text-red-500 hover:bg-red-50">خروج</button>
              </>) : <button onClick={() => setPage("login")} className="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm bg-slate-100 text-slate-700">ورود ادمین</button>}
            </nav>
          </div>
        </header>
      );
    }

    function AdminLogin({ setPage }) {
      const [pass, setPass] = useState(""); const [error, setError] = useState("");
      const { setIsAdmin } = useTournament();
      const handle = e => { e.preventDefault(); if (pass === ADMIN_PASSWORD) { setIsAdmin(true); setPage("admin"); } else setError("رمز اشتباه است"); };
      return (
        <div className="max-w-sm mx-auto mt-12 card p-6 sm:p-8 rounded-2xl mx-3">
          <h2 className="text-xl font-bold mb-5 text-center text-slate-800">ورود ادمین</h2>
          <form onSubmit={handle} className="space-y-4">
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="رمز عبور" className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-blue-400 outline-none text-slate-800" autoFocus />
            {error && <p className="text-red-500 text-sm">{error}</p>}
            <button type="submit" className="w-full btn-primary py-3 rounded-xl font-medium">ورود</button>
          </form>
          <button onClick={() => setPage("home")} className="w-full mt-4 text-sm text-slate-500">بازگشت</button>
        </div>
      );
    }

    function AdminPanel() {
      const { isAdmin } = useTournament(); const [tab, setTab] = useState("setup");
      if (!isAdmin) return <div className="text-center py-16 text-red-500">دسترسی غیرمجاز</div>;
      const tabs = [{id:"setup",label:"تنظیمات"},{id:"teams",label:"تیم‌ها"},{id:"draw",label:"قرعه‌کشی"},{id:"results",label:"نتایج"},{id:"schedule",label:"برنامه"},{id:"knockout",label:"حذفی"},{id:"news",label:"اخبار"},{id:"export",label:"پشتیبان"}];
      return (
        <div className="max-w-6xl mx-auto px-3 py-4">
          <h2 className="text-xl font-bold mb-4 text-slate-800">پنل مدیریت</h2>
          <div className="flex gap-1.5 overflow-x-auto pb-2 mb-4">{tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap shrink-0 ${tab===t.id?"bg-blue-500 text-white":"bg-white text-slate-600 border border-slate-200"}`}>{t.label}</button>)}</div>
          {tab==="setup"&&<SetupTab/>}{tab==="teams"&&<TeamsTab/>}{tab==="draw"&&<DrawTab/>}{tab==="results"&&<ResultsTab/>}{tab==="schedule"&&<ScheduleTab/>}{tab==="knockout"&&<KnockoutAdminTab/>}{tab==="news"&&<NewsAdminTab/>}{tab==="export"&&<ExportTab/>}
        </div>
      );
    }

    function SetupTab() {
      const { data, update } = useTournament(); const [cfg, setCfg] = useState({...data.config});
      const apply = () => {
        const numGroups = Math.ceil((+cfg.numTeams||0)/(+cfg.teamsPerGroup||1))||1;
        update(p=>({...p, config:{...cfg, numGroups, numTeams:+cfg.numTeams||20, teamsPerGroup:+cfg.teamsPerGroup||4, advancePerGroup:+cfg.advancePerGroup||2, bestSeconds:+cfg.bestSeconds||0}, stage:"setup", teams:[], groups:[], matches:[], knockout:{advancedFromGroups:[],advancedFromLosers:[]}}));
        alert("تنظیمات ذخیره شد");
      };
      return (
        <div className="card p-4 sm:p-6 rounded-2xl space-y-4">
          <h3 className="text-lg font-semibold text-slate-800">تنظیمات تورنمنت</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {[{k:"numTeams",l:"تعداد کل تیم‌ها"},{k:"teamsPerGroup",l:"تیم در هر گروه"},{k:"advancePerGroup",l:"صعود از هر گروه"},{k:"bestSeconds",l:"بهترین تیم‌های دوم (۰ اگر لازم نیست)"}].map(f=>(
              <label key={f.k} className="block"><span className="text-sm text-slate-500">{f.l}</span>
                <input type="text" inputMode="numeric" value={cfg[f.k]} onChange={e=>setCfg({...cfg,[f.k]:e.target.value.replace(/\\D/g,"")})} className="w-full mt-1 px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 text-base" />
              </label>
            ))}
          </div>
          <ul className="text-sm text-slate-600 list-disc pr-5 space-y-1"><li>برد ۲-۰ → ۳ امتیاز</li><li>برد ۲-۱ → ۲ برنده + ۱ بازنده</li><li>تساوی: تفاضل ست</li></ul>
          <button onClick={apply} className="btn-primary px-5 py-2.5 rounded-xl font-medium">اعمال و ریست</button>
        </div>
      );
    }

    function TeamsTab() {
      const { data, update } = useTournament(); const [names, setNames] = useState("");
      const add = () => { const list=names.split("\\n").map(n=>n.trim()).filter(Boolean); if(!list.length)return; const nt=list.map(n=>({id:generateId(),name:n,logo:null,groupId:null})); update(p=>({...p,teams:[...p.teams,...nt].slice(0,p.config.numTeams)})); setNames(""); };
      const logo = (id,f) => { if(!f)return; const r=new FileReader(); r.onload=e=>update(p=>({...p,teams:p.teams.map(t=>t.id===id?{...t,logo:e.target.result}:t)})); r.readAsDataURL(f); };
      return (
        <div className="space-y-4">
          <div className="card p-4 sm:p-6 rounded-2xl">
            <h3 className="font-semibold mb-3 text-slate-800">افزودن تیم‌ها (هر خط یک تیم)</h3>
            <textarea value={names} onChange={e=>setNames(e.target.value)} rows={5} placeholder={"تیم آ\\nتیم ب"} className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 mb-3 text-slate-800" />
            <button onClick={add} className="btn-primary px-4 py-2 rounded-xl text-sm">افزودن</button>
            <p className="text-sm text-slate-500 mt-2">{data.teams.length} / {data.config.numTeams}</p>
          </div>
          <div className="card p-4 sm:p-6 rounded-2xl">
            <h3 className="font-semibold mb-3 text-slate-800">لیست تیم‌ها</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              {data.teams.map((t,i)=>(
                <div key={t.id} className="flex items-center gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                  <span className="text-slate-400 text-xs w-5">{i+1}</span>
                  {t.logo?<img src={t.logo} className="logo-preview"/>:<div className="logo-preview flex items-center justify-center text-[10px] text-slate-400">لوگو</div>}
                  <input value={t.name} onChange={e=>update(p=>({...p,teams:p.teams.map(x=>x.id===t.id?{...x,name:e.target.value}:x)}))} className="flex-1 bg-transparent border-b border-slate-200 focus:border-blue-400 outline-none py-1 text-sm text-slate-800" />
                  <label className="text-[10px] text-blue-500 cursor-pointer shrink-0">لوگو<input type="file" accept="image/*" className="hidden" onChange={e=>logo(t.id,e.target.files[0])} /></label>
                  <button onClick={()=>update(p=>({...p,teams:p.teams.filter(x=>x.id!==t.id)}))} className="text-red-400 text-xs">×</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function DrawTab() {
      const { data, update } = useTournament(); const [dragId, setDragId] = useState(null);
      const doDraw = () => {
        if (data.teams.length < data.config.numTeams) { alert("تعداد تیم‌ها کامل نیست"); return; }
        const sh = [...data.teams].sort(()=>Math.random()-0.5); const groups=[]; const tpg=data.config.teamsPerGroup;
        for(let i=0;i<data.config.numGroups;i++){ const gt=sh.slice(i*tpg,(i+1)*tpg); const gid=`G${i+1}`; groups.push({id:gid,name:`گروه ${String.fromCharCode(65+i)}`}); gt.forEach(t=>t.groupId=gid); }
        const matches=[]; groups.forEach(g=>{ const gt=sh.filter(t=>t.groupId===g.id); for(let i=0;i<gt.length;i++) for(let j=i+1;j<gt.length;j++) matches.push({id:generateId(),team1Id:gt[i].id,team2Id:gt[j].id,score1:null,score2:null,groupId:g.id,stage:"group",date:"",time:""}); });
        update(p=>({...p,teams:sh,groups,matches,stage:"groups"})); alert("قرعه‌کشی انجام شد");
      };
      const move = (tid, gid) => update(p=>({...p,teams:p.teams.map(t=>t.id===tid?{...t,groupId:gid}:t)}));
      const onDS = (e,id) => { setDragId(id); e.dataTransfer.setData("text/plain",id); };
      const onDO = e => { e.preventDefault(); e.currentTarget.classList.add("drag-over"); };
      const onDL = e => e.currentTarget.classList.remove("drag-over");
      const onDp = (e,gid) => { e.preventDefault(); e.currentTarget.classList.remove("drag-over"); const id=e.dataTransfer.getData("text/plain")||dragId; if(id) move(id,gid); setDragId(null); };
      const un = data.teams.filter(t=>!t.groupId);
      return (
        <div className="space-y-4">
          <div className="card p-4 sm:p-6 rounded-2xl">
            <h3 className="font-semibold mb-2 text-slate-800">قرعه‌کشی و چینش دستی (درگ اند دراپ)</h3>
            <p className="text-sm text-slate-500 mb-3">تیم‌ها را بکشید و داخل گروه‌ها رها کنید (مثل PES). بعد از چینش، دکمه ساخت بازی را بزنید.</p>
            <button onClick={doDraw} className="btn-success px-5 py-2.5 rounded-xl text-sm font-medium">قرعه‌کشی تصادفی</button>
          </div>
          {un.length>0 && <div className="card p-4 rounded-2xl"><h4 className="text-sm font-medium text-slate-600 mb-2">بدون گروه</h4>
            <div className="flex flex-wrap gap-2 drop-zone p-2 rounded-xl border-2 border-dashed border-slate-200" onDragOver={onDO} onDragLeave={onDL} onDrop={e=>onDp(e,null)}>
              {un.map(t=><div key={t.id} draggable onDragStart={e=>onDS(e,t.id)} className="team-chip flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-sm shadow-sm">{t.logo&&<img src={t.logo} className="w-5 h-5 rounded"/>}<span>{t.name}</span></div>)}
            </div></div>}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            {data.groups.map(g=>{ const gt=data.teams.filter(t=>t.groupId===g.id); return (
              <div key={g.id} className="card p-3 rounded-xl drop-zone border-2 border-transparent" onDragOver={onDO} onDragLeave={onDL} onDrop={e=>onDp(e,g.id)}>
                <h4 className="font-bold text-blue-600 mb-2 text-sm">{g.name} <span className="text-slate-400 font-normal">({gt.length})</span></h4>
                <div className="space-y-1.5 min-h-[50px]">{gt.map(t=><div key={t.id} draggable onDragStart={e=>onDS(e,t.id)} className="team-chip flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-blue-50 border border-blue-100 text-sm">{t.logo&&<img src={t.logo} className="w-5 h-5 rounded"/>}<span className="flex-1 truncate">{t.name}</span><button onClick={()=>move(t.id,null)} className="text-slate-400 text-xs">×</button></div>)}{gt.length===0&&<p className="text-xs text-slate-400 text-center py-3">تیم را اینجا رها کنید</p>}</div>
              </div>);})}
          </div>
          {data.groups.length>0 && <button onClick={()=>{ const matches=[]; data.groups.forEach(g=>{ const gt=data.teams.filter(t=>t.groupId===g.id); for(let i=0;i<gt.length;i++) for(let j=i+1;j<gt.length;j++) matches.push({id:generateId(),team1Id:gt[i].id,team2Id:gt[j].id,score1:null,score2:null,groupId:g.id,stage:"group",date:"",time:""}); }); update(p=>({...p,matches:[...matches,...p.matches.filter(m=>m.stage!=="group")],stage:"groups"})); alert("بازی‌های گروهی ساخته/به‌روز شد"); }} className="btn-primary px-5 py-2.5 rounded-xl text-sm">ساخت/به‌روزرسانی بازی‌های گروهی</button>}
        </div>
      );
    }

    function ResultsTab() {
      const { data, update } = useTournament();
      const setScore = (id,s1,s2) => update(p=>({...p,matches:p.matches.map(m=>m.id===id?{...m,score1:s1===""?null:+s1,score2:s2===""?null:+s2}:m)}));
      const sorted = [...data.matches].sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"").localeCompare(b.time||""));
      return (
        <div className="card p-4 sm:p-6 rounded-2xl">
          <h3 className="font-semibold mb-3 text-slate-800">ثبت نتایج (مرتب بر اساس تاریخ)</h3>
          <div className="space-y-2 max-h-[70vh] overflow-y-auto">
            {sorted.map(m=>{ const t1=data.teams.find(t=>t.id===m.team1Id); const t2=data.teams.find(t=>t.id===m.team2Id); return (
              <div key={m.id} className="flex flex-wrap items-center gap-2 p-2.5 rounded-xl bg-slate-50 text-sm">
                <span className="text-[10px] text-slate-400 w-full sm:w-auto">{m.date||"بدون تاریخ"} {m.time||""} · {m.stage==="group"?"گروهی":m.stage}</span>
                <span className="w-24 truncate text-slate-700">{t1?.name}</span>
                <input type="text" inputMode="numeric" value={m.score1??""} onChange={e=>setScore(m.id,e.target.value.replace(/\\D/g,"").slice(0,1),m.score2)} className="w-10 px-1 py-1 rounded-lg bg-white border border-slate-200 text-center text-slate-800" />
                <span className="text-slate-400">-</span>
                <input type="text" inputMode="numeric" value={m.score2??""} onChange={e=>setScore(m.id,m.score1,e.target.value.replace(/\\D/g,"").slice(0,1))} className="w-10 px-1 py-1 rounded-lg bg-white border border-slate-200 text-center text-slate-800" />
                <span className="w-24 truncate text-slate-700">{t2?.name}</span>
              </div>);})}
            {sorted.length===0&&<p className="text-slate-400 text-center py-6">بازی‌ای وجود ندارد</p>}
          </div>
        </div>
      );
    }

    function ScheduleTab() {
      const { data, update } = useTournament();
      const upd = (id,f,v) => update(p=>({...p,matches:p.matches.map(m=>m.id===id?{...m,[f]:v}:m)}));
      return (
        <div className="card p-4 sm:p-6 rounded-2xl">
          <h3 className="font-semibold mb-2 text-slate-800">برنامه‌ریزی روز و ساعت (۲۴ ساعته)</h3>
          <p className="text-xs text-slate-500 mb-3">تاریخ را میلادی وارد کنید (مثال: ۲۰۲۵-۰۹-۱۶). ساعت ۲۴ ساعته است.</p>
          <div className="space-y-2 max-h-[65vh] overflow-y-auto">
            {data.matches.map(m=>{ const t1=data.teams.find(t=>t.id===m.team1Id)?.name||"?"; const t2=data.teams.find(t=>t.id===m.team2Id)?.name||"?"; return (
              <div key={m.id} className="flex flex-wrap items-center gap-2 p-2.5 rounded-xl bg-slate-50 text-sm">
                <span className="w-36 truncate text-slate-700">{t1} vs {t2}</span>
                <input type="date" value={m.date||""} onChange={e=>upd(m.id,"date",e.target.value)} className="px-2 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-800 text-sm" />
                <input type="time" value={m.time||""} onChange={e=>upd(m.id,"time",e.target.value)} className="px-2 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-800 text-sm" />
                <span className="text-[10px] text-slate-400">{m.stage==="group"?"گروهی":m.stage}</span>
              </div>);})}
          </div>
        </div>
      );
    }

    function KnockoutAdminTab() {
      const { data, update } = useTournament();
      const computeFirst = () => {
        const {config,teams,matches,groups}=data; const allS=[], adv=[];
        groups.forEach(g=>{ const st=calcStandings(teams,matches,g.id); for(let i=0;i<config.advancePerGroup&&i<st.length;i++) adv.push({...st[i].team,fromGroup:g.id,rank:i+1}); if(st.length>config.advancePerGroup) allS.push({...st[config.advancePerGroup].team,fromGroup:g.id,stats:st[config.advancePerGroup]}); });
        allS.sort((a,b)=>b.stats.points-a.stats.points||b.stats.setDiff-a.stats.setDiff||b.stats.setsWon-a.stats.setsWon);
        const best=allS.slice(0,config.bestSeconds).map(s=>({...s,rank:"best2nd"})); const fin=[...adv,...best]; const pairs=Math.floor(fin.length/2); const rm=[];
        for(let i=0;i<pairs;i++){ const t1=fin[i],t2=fin[fin.length-1-i]; if(t1&&t2) rm.push({id:generateId(),team1Id:t1.id,team2Id:t2.id,score1:null,score2:null,stage:"r12",date:"",time:""}); }
        update(p=>({...p,knockout:{...p.knockout,advancedFromGroups:fin},matches:[...p.matches.filter(m=>m.stage==="group"),...rm],stage:"knockout"}));
        alert(fin.length+" تیم صعودکننده مشخص و دور اول حذفی ساخته شد");
      };
      const toQuarter = () => {
        const r=data.matches.filter(m=>m.stage==="r12"&&m.score1!=null); if(!r.length){alert("نتایج دور اول را ثبت کنید");return;}
        const w=[],l=[]; r.forEach(m=>{ const t1=data.teams.find(t=>t.id===m.team1Id),t2=data.teams.find(t=>t.id===m.team2Id); if(m.score1>m.score2){w.push(t1);l.push({team:t2,setDiff:m.score2-m.score1,setsWon:m.score2});}else{w.push(t2);l.push({team:t1,setDiff:m.score1-m.score2,setsWon:m.score1});} });
        l.sort((a,b)=>b.setDiff-a.setDiff||b.setsWon-a.setsWon); const bl=l.slice(0,2).map(x=>x.team); const eight=[...w,...bl]; const qs=[];
        for(let i=0;i<Math.floor(eight.length/2);i++) qs.push({id:generateId(),team1Id:eight[i].id,team2Id:eight[eight.length-1-i].id,score1:null,score2:null,stage:"quarter",date:"",time:""});
        update(p=>({...p,knockout:{...p.knockout,advancedFromLosers:bl},matches:[...p.matches.filter(m=>!["quarter","semi","third","final"].includes(m.stage)),...qs]})); alert("یک‌چهارم ساخته شد");
      };
      const toSemi = () => {
        const qs=data.matches.filter(m=>m.stage==="quarter"&&m.score1!=null); if(qs.length<2){alert("نتایج یک‌چهارم را کامل کنید");return;}
        const w=qs.map(m=>m.score1>m.score2?m.team1Id:m.team2Id); const semis=[]; for(let i=0;i<w.length;i+=2) if(w[i+1]) semis.push({id:generateId(),team1Id:w[i],team2Id:w[i+1],score1:null,score2:null,stage:"semi",date:"",time:""});
        update(p=>({...p,matches:[...p.matches.filter(m=>!["semi","third","final"].includes(m.stage)),...semis]})); alert("نیمه‌نهایی ساخته شد");
      };
      const makeFinal = () => {
        const semis=data.matches.filter(m=>m.stage==="semi"&&m.score1!=null); if(!semis.length){alert("نتایج نیمه‌نهایی را ثبت کنید");return;}
        const f=[],th=[]; semis.forEach(m=>{ if(m.score1>m.score2){f.push(m.team1Id);th.push(m.team2Id);}else{f.push(m.team2Id);th.push(m.team1Id);} });
        const final={id:generateId(),team1Id:f[0],team2Id:f[1]||f[0],score1:null,score2:null,stage:"final",date:"",time:""};
        const third=th.length>=2?{id:generateId(),team1Id:th[0],team2Id:th[1],score1:null,score2:null,stage:"third",date:"",time:""}:null;
        update(p=>({...p,matches:[...p.matches.filter(m=>!["final","third"].includes(m.stage)),final,...(third?[third]:[])],stage:"finished"})); alert("فینال و رده‌بندی ساخته شد");
      };
      return (
        <div className="space-y-4">
          <div className="card p-4 sm:p-6 rounded-2xl space-y-3">
            <h3 className="font-semibold text-slate-800">مدیریت دور حذفی</h3>
            <div className="flex flex-wrap gap-2">
              <button onClick={computeFirst} className="btn-primary px-4 py-2 rounded-xl text-sm">محاسبه دور اول حذفی</button>
              <button onClick={toQuarter} className="btn-success px-4 py-2 rounded-xl text-sm">ساخت یک‌چهارم نهایی</button>
              <button onClick={toSemi} className="btn-primary px-4 py-2 rounded-xl text-sm">ساخت نیمه‌نهایی</button>
              <button onClick={makeFinal} className="btn-success px-4 py-2 rounded-xl text-sm">فینال و رده‌بندی</button>
            </div>
          </div>
          <div className="card p-4 rounded-2xl">
            <h3 className="font-semibold mb-3 text-slate-800">ثبت نتایج حذفی</h3>
            {["r12","quarter","semi","third","final"].map(stage=>{ const ms=data.matches.filter(m=>m.stage===stage); if(!ms.length)return null; const titles={r12:"دور اول حذفی",quarter:"یک‌چهارم",semi:"نیمه‌نهایی",third:"رده‌بندی",final:"فینال"}; return (
              <div key={stage} className="mb-3"><h4 className="font-bold text-amber-600 text-sm mb-1.5">{titles[stage]}</h4>
                {ms.map(m=>{ const t1=data.teams.find(t=>t.id===m.team1Id); const t2=data.teams.find(t=>t.id===m.team2Id); return (
                  <div key={m.id} className="flex items-center gap-2 p-2 rounded-lg bg-slate-50 mb-1 text-sm">
                    <span className="w-28 truncate">{t1?.name}</span>
                    <input type="text" inputMode="numeric" value={m.score1??""} onChange={e=>update(p=>({...p,matches:p.matches.map(x=>x.id===m.id?{...x,score1:e.target.value===""?null:+e.target.value.replace(/\\D/g,"").slice(0,1)}:x)}))} className="w-10 px-1 py-1 rounded bg-white border text-center" />
                    <span>-</span>
                    <input type="text" inputMode="numeric" value={m.score2??""} onChange={e=>update(p=>({...p,matches:p.matches.map(x=>x.id===m.id?{...x,score2:e.target.value===""?null:+e.target.value.replace(/\\D/g,"").slice(0,1)}:x)}))} className="w-10 px-1 py-1 rounded bg-white border text-center" />
                    <span className="w-28 truncate">{t2?.name}</span>
                  </div>);})}
              </div>);})}
          </div>
        </div>
      );
    }

    function NewsAdminTab() {
      const { data, update } = useTournament(); const [title,setTitle]=useState(""); const [body,setBody]=useState("");
      const add = () => { if(!title.trim())return; update(p=>({...p,news:[{id:generateId(),title:title.trim(),body:body.trim(),date:todayStr()},...p.news]})); setTitle(""); setBody(""); };
      return (
        <div className="space-y-4">
          <div className="card p-4 sm:p-6 rounded-2xl">
            <h3 className="font-semibold mb-3 text-slate-800">افزودن خبر / اطلاعیه</h3>
            <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="عنوان" className="w-full px-3 py-2 rounded-xl bg-slate-50 border mb-2 text-slate-800" />
            <textarea value={body} onChange={e=>setBody(e.target.value)} rows={3} placeholder="متن" className="w-full px-3 py-2 rounded-xl bg-slate-50 border mb-2 text-slate-800" />
            <button onClick={add} className="btn-primary px-4 py-2 rounded-xl text-sm">انتشار</button>
          </div>
          <div className="space-y-2">{data.news.map(n=><div key={n.id} className="card p-3 rounded-xl flex justify-between"><div><div className="font-medium text-slate-800">{n.title}</div><div className="text-sm text-slate-500 mt-1">{n.body}</div><div className="text-[10px] text-slate-400 mt-1">{n.date}</div></div><button onClick={()=>update(p=>({...p,news:p.news.filter(x=>x.id!==n.id)}))} className="text-red-400 text-sm">حذف</button></div>)}</div>
        </div>
      );
    }

    function ExportTab() {
      const { data, update } = useTournament();
      const exp = () => { const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="golbahar-backup.json"; a.click(); };
      const imp = e => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{update(JSON.parse(ev.target.result));alert("بارگذاری شد");}catch{alert("خطا");} }; r.readAsText(f); };
      return (
        <div className="card p-4 sm:p-6 rounded-2xl space-y-3">
          <h3 className="font-semibold text-slate-800">پشتیبان‌گیری</h3>
          <p className="text-sm text-slate-500">برای انتقال بین دستگاه‌ها export/import کنید.</p>
          <div className="flex flex-wrap gap-2">
            <button onClick={exp} className="btn-primary px-4 py-2 rounded-xl text-sm">دانلود JSON</button>
            <label className="btn-success px-4 py-2 rounded-xl text-sm cursor-pointer">بارگذاری<input type="file" accept=".json" className="hidden" onChange={imp} /></label>
            <button onClick={()=>{if(confirm("ریست؟"))update(getDefaultData());}} className="btn-danger px-4 py-2 rounded-xl text-sm">ریست</button>
          </div>
        </div>
      );
    }

    function PublicHome({ setPage, setSelectedTeam }) {
      const { data } = useTournament(); const [matchTab, setMatchTab] = useState("today"); const today = todayStr();
      const byDate = useMemo(() => {
        const past=[], todayM=[], future=[];
        data.matches.forEach(m => { if(!m.date){todayM.push(m);return;} if(m.date<today)past.push(m); else if(m.date===today)todayM.push(m); else future.push(m); });
        past.sort((a,b)=>b.date.localeCompare(a.date)||(b.time||"").localeCompare(a.time||""));
        todayM.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
        future.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));
        return {past,today:todayM,future};
      }, [data.matches, today]);
      const renderM = m => {
        const t1=data.teams.find(t=>t.id===m.team1Id); const t2=data.teams.find(t=>t.id===m.team2Id); const played=m.score1!=null&&m.score2!=null;
        return (
          <div key={m.id} className="flex flex-wrap items-center justify-between gap-2 p-3 rounded-xl bg-white border border-blue-50 text-sm">
            <div className="flex items-center gap-2 min-w-0 flex-1">
              <button onClick={()=>{setSelectedTeam(t1);setPage("team");}} className="flex items-center gap-1.5 min-w-0 hover:text-blue-600">{t1?.logo&&<img src={t1.logo} className="w-6 h-6 rounded"/>}<span className="truncate max-w-[80px] sm:max-w-[120px]">{t1?.name||"?"}</span></button>
              <span className={`font-mono font-bold px-1 ${played?"text-slate-800":"text-slate-400"}`}>{played?`${m.score1} - ${m.score2}`:"vs"}</span>
              <button onClick={()=>{setSelectedTeam(t2);setPage("team");}} className="flex items-center gap-1.5 min-w-0 hover:text-blue-600"><span className="truncate max-w-[80px] sm:max-w-[120px]">{t2?.name||"?"}</span>{t2?.logo&&<img src={t2.logo} className="w-6 h-6 rounded"/>}</button>
            </div>
            <div className="text-[10px] text-slate-400 shrink-0">{m.date} {m.time} · {m.stage==="group"?"گروهی":m.stage}</div>
          </div>
        );
      };
      return (
        <div className="max-w-6xl mx-auto px-3 py-5 space-y-8">
          <div className="text-center"><h2 className="text-2xl sm:text-3xl font-bold text-slate-800 mb-1">🏐 مسابقات والیبال گلبهار</h2>
            <p className="text-sm text-slate-500">{data.stage==="setup"?"در حال آماده‌سازی":data.stage==="groups"?"مرحله گروهی":data.stage==="knockout"?"مرحله حذفی":"پایان یافته"}</p></div>
          <section>
            <div className="flex gap-1.5 mb-3 overflow-x-auto">{[{id:"today",label:"امروز"},{id:"future",label:"آینده"},{id:"past",label:"گذشته"}].map(t=><button key={t.id} onClick={()=>setMatchTab(t.id)} className={`px-4 py-2 rounded-xl text-sm font-medium shrink-0 ${matchTab===t.id?"tab-active":"bg-white text-slate-600 border border-slate-200"}`}>{t.label}</button>)}</div>
            <div className="card rounded-2xl p-3 space-y-2 max-h-[40vh] overflow-y-auto">{(matchTab==="today"?byDate.today:matchTab==="future"?byDate.future:byDate.past).length===0?<p className="text-slate-400 text-center py-8 text-sm">بازی‌ای در این بخش نیست</p>:(matchTab==="today"?byDate.today:matchTab==="future"?byDate.future:byDate.past).map(renderM)}</div>
          </section>
          {data.groups.length>0&&<section><h3 className="text-lg font-bold text-blue-700 mb-3">جدول گروه‌ها</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">{data.groups.map(g=>{ const st=calcStandings(data.teams,data.matches,g.id); return (
              <div key={g.id} className="card rounded-xl overflow-hidden"><div className="bg-blue-500 text-white px-3 py-2 font-bold text-sm">{g.name}</div>
                <table className="w-full text-xs sm:text-sm"><thead><tr className="text-slate-500 border-b border-slate-100"><th className="py-1.5 pr-2 text-right">تیم</th><th className="py-1.5">ب</th><th className="py-1.5">برد</th><th className="py-1.5">ست</th><th className="py-1.5">امتیاز</th></tr></thead>
                <tbody>{st.map((s,i)=><tr key={s.team.id} className={`border-b border-slate-50 ${i<data.config.advancePerGroup?"bg-green-50":""}`}><td className="py-1.5 pr-2"><button onClick={()=>{setSelectedTeam(s.team);setPage("team");}} className="flex items-center gap-1.5 hover:text-blue-600 text-right">{s.team.logo&&<img src={s.team.logo} className="w-5 h-5 rounded"/>}<span className="truncate max-w-[90px]">{s.team.name}</span></button></td><td className="text-center">{s.played}</td><td className="text-center">{s.wins}</td><td className="text-center">{s.setsWon}-{s.setsLost}</td><td className="text-center font-bold text-blue-600">{s.points}</td></tr>)}</tbody></table></div>);})}</div></section>}
          {data.knockout?.advancedFromGroups?.length>0&&<section><h3 className="text-lg font-bold text-green-700 mb-3">تیم‌های صعودکننده (تا این لحظه)</h3>
            <div className="flex flex-wrap gap-2">{data.knockout.advancedFromGroups.map((t,i)=><button key={t.id||i} onClick={()=>{setSelectedTeam(t);setPage("team");}} className="card px-3 py-2 rounded-xl flex items-center gap-2 text-sm hover:ring-2 hover:ring-blue-300">{t.logo&&<img src={t.logo} className="w-7 h-7 rounded"/>}<span className="font-medium">{t.name}</span><span className="text-[10px] text-slate-400">{t.rank==="best2nd"?"بهترین دوم":`رتبه ${t.rank}`}</span></button>)}</div></section>}
          <section><h3 className="text-lg font-bold text-slate-700 mb-3">اخبار و اطلاعیه‌ها</h3>
            <div className="space-y-2">{data.news.length===0?<p className="text-slate-400 text-sm card p-4 rounded-xl text-center">هنوز خبری منتشر نشده</p>:data.news.slice(0,5).map(n=><div key={n.id} className="card p-3 sm:p-4 rounded-xl news-item"><div className="font-medium text-slate-800">{n.title}</div><div className="text-sm text-slate-600 mt-1">{n.body}</div><div className="text-[10px] text-slate-400 mt-1.5">{n.date}</div></div>)}</div></section>
          <section><h3 className="text-lg font-bold text-slate-700 mb-3">خلاصه تمام بازی‌ها</h3>
            <div className="card rounded-xl p-3 max-h-[35vh] overflow-y-auto space-y-1.5">{[...data.matches].sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).map(renderM)}{data.matches.length===0&&<p className="text-slate-400 text-center py-6 text-sm">بازی‌ای ثبت نشده</p>}</div></section>
        </div>
      );
    }

    function TeamPage({ team, setPage }) {
      const { data } = useTournament(); if (!team) return null;
      const tms = data.matches.filter(m=>m.team1Id===team.id||m.team2Id===team.id).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
      const gst = team.groupId ? calcStandings(data.teams, data.matches, team.groupId) : [];
      const rank = gst.findIndex(s=>s.team.id===team.id);
      return (
        <div className="max-w-2xl mx-auto px-3 py-5 space-y-5">
          <button onClick={()=>setPage("home")} className="text-sm text-blue-600 hover:underline">← بازگشت</button>
          <div className="card p-5 rounded-2xl flex items-center gap-4">
            {team.logo?<img src={team.logo} className="w-16 h-16 rounded-xl object-contain bg-slate-50"/>:<div className="w-16 h-16 rounded-xl bg-slate-100 flex items-center justify-center text-2xl">🏐</div>}
            <div><h2 className="text-xl font-bold text-slate-800">{team.name}</h2>{team.groupId&&<p className="text-sm text-slate-500">گروه {data.groups.find(g=>g.id===team.groupId)?.name?.replace("گروه ","")} · رتبه: {rank>=0?rank+1:"-"}</p>}</div>
          </div>
          {gst.length>0&&<div className="card rounded-xl overflow-hidden"><div className="bg-blue-500 text-white px-3 py-2 text-sm font-bold">جدول گروه</div>
            <table className="w-full text-sm"><thead><tr className="text-slate-500 text-xs border-b"><th className="py-1.5 pr-2 text-right">تیم</th><th>ب</th><th>برد</th><th>ست</th><th>امتیاز</th></tr></thead>
            <tbody>{gst.map((s,i)=><tr key={s.team.id} className={`border-b border-slate-50 ${s.team.id===team.id?"bg-blue-50 font-medium":""}`}><td className="py-1.5 pr-2 flex items-center gap-1.5">{s.team.logo&&<img src={s.team.logo} className="w-5 h-5 rounded"/>}<span>{s.team.name}</span></td><td className="text-center">{s.played}</td><td className="text-center">{s.wins}</td><td className="text-center">{s.setsWon}-{s.setsLost}</td><td className="text-center font-bold text-blue-600">{s.points}</td></tr>)}</tbody></table></div>}
          <div><h3 className="font-bold text-slate-700 mb-2">بازی‌های این تیم</h3>
            <div className="space-y-2">{tms.length===0?<p className="text-slate-400 text-sm">بازی‌ای ثبت نشده</p>:tms.map(m=>{ const isH=m.team1Id===team.id; const opp=data.teams.find(t=>t.id===(isH?m.team2Id:m.team1Id)); const played=m.score1!=null; const my=isH?m.score1:m.score2; const op=isH?m.score2:m.score1; return (
              <div key={m.id} className="card p-3 rounded-xl flex items-center justify-between text-sm"><div className="flex items-center gap-2"><span className="text-slate-500 text-xs w-20">{m.date||"-"} {m.time||""}</span><span>vs {opp?.name}</span></div>
                <span className={`font-mono font-bold ${played?(my>op?"text-green-600":my<op?"text-red-500":"text-slate-600"):"text-slate-400"}`}>{played?`${my} - ${op}`:"آینده"}</span></div>);})}</div>
          </div>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState("home"); const [selectedTeam, setSelectedTeam] = useState(null);
      useEffect(() => { if (page==="team" && !selectedTeam) setPage("home"); }, [page, selectedTeam]);
      return (
        <TournamentProvider>
          <Header page={page} setPage={setPage} />
          {page==="home" && <PublicHome setPage={setPage} setSelectedTeam={setSelectedTeam} />}
          {page==="login" && <AdminLogin setPage={setPage} />}
          {page==="admin" && <AdminPanel />}
          {page==="team" && selectedTeam && <TeamPage team={selectedTeam} setPage={setPage} />}
        </TournamentProvider>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
