<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقات والیبال گلبهار</title>
</head>
<body style="font-family:Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8fafc">
<div id="boot" style="text-align:center;color:#64748b">
<div style="width:40px;height:40px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite"></div>
در حال بارگذاری...
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
(async function(){
  var n = 7;
  try {
    var parts = await Promise.all(Array.from({length:n}, function(_,i){
      return fetch('js/html'+i+'.b64?v=1').then(function(r){if(!r.ok)throw new Error('part '+i);return r.text();});
    }));
    var b64 = parts.join('');
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    var ds = new DecompressionStream('deflate');
    var stream = new Response(bytes).body.pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.getElementById('boot').innerHTML = '<div style="color:#e11d48;font-weight:bold">خطا: '+e.message+'</div><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;background:#059669;color:#fff;border:0;border-radius:8px">تلاش مجدد</button>';
  }
})();
</script>
</body>
</html>
