<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مسابقات والیبال گلبهار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.development.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Vazirmatn', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%); min-height: 100vh; }
    .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.2); }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .btn-primary:hover { background: linear-gradient(135deg, #2563eb, #1e40af); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .logo-preview { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: #1e293b; }
  </style>
</head>
<body class="text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, createContext, useContext } = React;
    const { BrowserRouter, Routes, Route, Link, useNavigate, Navigate } = ReactRouterDOM;

    // ==================== CONSTANTS & TYPES ====================
    const ADMIN_PASSWORD = "golbahar1404"; // رمز ثابت ادمین - می‌تونی عوض کنی
    const STORAGE_KEY = "golbahar_volleyball_tournament_v1";

    // ==================== STORAGE ====================
    const loadData = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return getDefaultData();
    };

    const saveData = (data) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    };

    const getDefaultData = () => ({
      config: {
        numTeams: 20,
        teamsPerGroup: 4,
        numGroups: 5,
        advancePerGroup: 2,
        bestSeconds: 2, // برای رسیدن به ۱۲ تیم
        matchFormat: "bestOf3", // تا ۲ ست
        pointsWin20: 3,
        pointsWin21: 2,
        pointsLose21: 1,
      },
      teams: [],
      groups: [],
      matches: [],
      schedule: [],
      knockout: {
        roundOf12: [],
        quarter: [],
        semi: [],
        third: null,
        final: null,
        advancedFromLosers: []
      },
      stage: "setup", // setup | groups | knockout | finished
    });

    // ==================== CONTEXT ====================
    const TournamentContext = createContext(null);

    function TournamentProvider({ children }) {
      const [data, setData] = useState(loadData);
      const [isAdmin, setIsAdmin] = useState(false);

      useEffect(() => {
        saveData(data);
      }, [data]);

      const update = (updater) => {
        setData(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          return next;
        });
      };

      return (
        <TournamentContext.Provider value={{ data, update, isAdmin, setIsAdmin }}>
          {children}
        </TournamentContext.Provider>
      );
    }

    const useTournament = () => useContext(TournamentContext);

    // ==================== HELPERS ====================
    const calcStandings = (teams, matches, groupId) => {
      const groupTeams = teams.filter(t => t.groupId === groupId);
      const stats = {};
      groupTeams.forEach(t => {
        stats[t.id] = { team: t, played: 0, wins: 0, losses: 0, setsWon: 0, setsLost: 0, points: 0, setDiff: 0 };
      });

      matches.filter(m => m.groupId === groupId && m.score1 !== null && m.score2 !== null).forEach(m => {
        const s1 = stats[m.team1Id];
        const s2 = stats[m.team2Id];
        if (!s1 || !s2) return;
        s1.played++; s2.played++;
        s1.setsWon += m.score1; s1.setsLost += m.score2;
        s2.setsWon += m.score2; s2.setsLost += m.score1;
        if (m.score1 > m.score2) {
          s1.wins++; s2.losses++;
          if (m.score1 === 2 && m.score2 === 0) s1.points += 3;
          else { s1.points += 2; s2.points += 1; }
        } else {
          s2.wins++; s1.losses++;
          if (m.score2 === 2 && m.score1 === 0) s2.points += 3;
          else { s2.points += 2; s1.points += 1; }
        }
        s1.setDiff = s1.setsWon - s1.setsLost;
        s2.setDiff = s2.setsWon - s2.setsLost;
      });

      return Object.values(stats).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.setDiff !== a.setDiff) return b.setDiff - a.setDiff;
        if (b.setsWon !== a.setsWon) return b.setsWon - a.setsWon;
        return a.team.name.localeCompare(b.team.name, "fa");
      });
    };

    const generateId = () => Math.random().toString(36).slice(2, 10);

    // ==================== COMPONENTS ====================
    function Header() {
      const { isAdmin, setIsAdmin } = useTournament();
      const navigate = useNavigate();

      return (
        <header className="border-b border-slate-700/50 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
          <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <Link to="/" className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-xl font-bold">🏐</div>
              <div>
                <h1 className="font-bold text-lg">مسابقات والیبال گلبهار</h1>
                <p className="text-xs text-slate-400">تورنمنت گروهی + حذفی</p>
              </div>
            </Link>
            <nav className="flex items-center gap-2">
              <Link to="/" className="px-3 py-1.5 rounded-lg hover:bg-slate-700 text-sm">صفحه عمومی</Link>
              {isAdmin ? (
                <>
                  <Link to="/admin" className="px-3 py-1.5 rounded-lg bg-blue-600/30 text-blue-300 text-sm">پنل ادمین</Link>
                  <button onClick={() => { setIsAdmin(false); navigate("/"); }} className="px-3 py-1.5 rounded-lg text-red-400 text-sm hover:bg-red-900/30">خروج</button>
                </>
              ) : (
                <Link to="/admin-login" className="px-3 py-1.5 rounded-lg bg-slate-700 text-sm">ورود ادمین</Link>
              )}
            </nav>
          </div>
        </header>
      );
    }

    function AdminLogin() {
      const [pass, setPass] = useState("");
      const [error, setError] = useState("");
      const { setIsAdmin } = useTournament();
      const navigate = useNavigate();

      const handleLogin = (e) => {
        e.preventDefault();
        if (pass === ADMIN_PASSWORD) {
          setIsAdmin(true);
          navigate("/admin");
        } else {
          setError("رمز اشتباه است");
        }
      };

      return (
        <div className="max-w-md mx-auto mt-20 card p-8 rounded-2xl">
          <h2 className="text-2xl font-bold mb-6 text-center">ورود ادمین</h2>
          <form onSubmit={handleLogin} className="space-y-4">
            <input
              type="password"
              value={pass}
              onChange={e => setPass(e.target.value)}
              placeholder="رمز عبور"
              className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 focus:border-blue-500 outline-none"
            />
            {error && <p className="text-red-400 text-sm">{error}</p>}
            <button type="submit" className="w-full btn-primary py-3 rounded-xl font-medium">ورود</button>
          </form>
          <p className="text-xs text-slate-500 mt-4 text-center">رمز پیش‌فرض: golbahar1404 (در کد قابل تغییر)</p>
        </div>
      );
    }

    function AdminPanel() {
      const { data, update, isAdmin } = useTournament();
      const [tab, setTab] = useState("setup");
      const navigate = useNavigate();

      useEffect(() => {
        if (!isAdmin) navigate("/admin-login");
      }, [isAdmin]);

      if (!isAdmin) return null;

      return (
        <div className="max-w-6xl mx-auto px-4 py-6">
          <h2 className="text-2xl font-bold mb-6">پنل مدیریت تورنمنت</h2>
          <div className="flex flex-wrap gap-2 mb-6">
            {["setup", "teams", "draw", "results", "schedule", "knockout", "export"].map(t => (
              <button
                key={t}
                onClick={() => setTab(t)}
                className={`px-4 py-2 rounded-xl text-sm font-medium transition ${tab === t ? "bg-blue-600 text-white" : "bg-slate-700 hover:bg-slate-600"}`}
              >
                {t === "setup" && "تنظیمات"}
                {t === "teams" && "تیم‌ها و لوگو"}
                {t === "draw" && "قرعه‌کشی و گروه‌ها"}
                {t === "results" && "ثبت نتایج"}
                {t === "schedule" && "برنامه‌ریزی"}
                {t === "knockout" && "حذفی و صعود"}
                {t === "export" && "پشتیبان‌گیری"}
              </button>
            ))}
          </div>

          {tab === "setup" && <SetupTab />}
          {tab === "teams" && <TeamsTab />}
          {tab === "draw" && <DrawTab />}
          {tab === "results" && <ResultsTab />}
          {tab === "schedule" && <ScheduleTab />}
          {tab === "knockout" && <KnockoutAdminTab />}
          {tab === "export" && <ExportTab />}
        </div>
      );
    }

    function SetupTab() {
      const { data, update } = useTournament();
      const [cfg, setCfg] = useState(data.config);

      const apply = () => {
        const numGroups = Math.ceil(cfg.numTeams / cfg.teamsPerGroup);
        update(prev => ({
          ...prev,
          config: { ...cfg, numGroups },
          stage: "setup",
          teams: [],
          groups: [],
          matches: [],
          knockout: getDefaultData().knockout
        }));
        alert("تنظیمات ذخیره شد. حالا تیم‌ها را وارد کنید.");
      };

      return (
        <div className="card p-6 rounded-2xl space-y-4">
          <h3 className="text-xl font-semibold mb-4">تنظیمات اولیه تورنمنت</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label className="block">
              <span className="text-sm text-slate-400">تعداد کل تیم‌ها</span>
              <input type="number" min="4" max="64" value={cfg.numTeams}
                onChange={e => setCfg({ ...cfg, numTeams: +e.target.value })}
                className="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-600" />
            </label>
            <label className="block">
              <span className="text-sm text-slate-400">تعداد تیم در هر گروه</span>
              <input type="number" min="3" max="8" value={cfg.teamsPerGroup}
                onChange={e => setCfg({ ...cfg, teamsPerGroup: +e.target.value })}
                className="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-600" />
            </label>
            <label className="block">
              <span className="text-sm text-slate-400">صعود از هر گروه</span>
              <input type="number" min="1" max="4" value={cfg.advancePerGroup}
                onChange={e => setCfg({ ...cfg, advancePerGroup: +e.target.value })}
                className="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-600" />
            </label>
            <label className="block">
              <span className="text-sm text-slate-400">تعداد بهترین تیم‌های دوم (برای پر کردن)</span>
              <input type="number" min="0" max="8" value={cfg.bestSeconds}
                onChange={e => setCfg({ ...cfg, bestSeconds: +e.target.value })}
                className="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-600" />
            </label>
          </div>
          <p className="text-sm text-slate-400">
            با این تنظیمات: {cfg.numTeams} تیم → {Math.ceil(cfg.numTeams / cfg.teamsPerGroup)} گروه → 
            {cfg.advancePerGroup * Math.ceil(cfg.numTeams / cfg.teamsPerGroup) + cfg.bestSeconds} تیم به دور حذفی
          </p>
          <div className="pt-2">
            <p className="text-sm mb-2">امتیازدهی (ثابت):</p>
            <ul className="text-sm text-slate-300 list-disc pr-5 space-y-1">
              <li>برد ۲-۰ → ۳ امتیاز</li>
              <li>برد ۲-۱ → ۲ امتیاز برنده + ۱ امتیاز بازنده</li>
              <li>رتبه‌بندی در صورت تساوی امتیاز: تفاضل ست → ست‌های زده</li>
            </ul>
          </div>
          <button onClick={apply} className="btn-primary px-6 py-2.5 rounded-xl font-medium">اعمال و ریست تورنمنت</button>
        </div>
      );
    }

    function TeamsTab() {
      const { data, update } = useTournament();
      const [names, setNames] = useState("");
      const [selectedTeam, setSelectedTeam] = useState(null);

      const addTeams = () => {
        const list = names.split("\n").map(n => n.trim()).filter(Boolean);
        if (list.length === 0) return;
        const newTeams = list.map(name => ({
          id: generateId(),
          name,
          logo: null,
          groupId: null
        }));
        update(prev => ({
          ...prev,
          teams: [...prev.teams, ...newTeams].slice(0, prev.config.numTeams)
        }));
        setNames("");
      };

      const handleLogo = (teamId, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          update(prev => ({
            ...prev,
            teams: prev.teams.map(t => t.id === teamId ? { ...t, logo: e.target.result } : t)
          }));
        };
        reader.readAsDataURL(file);
      };

      const removeTeam = (id) => {
        update(prev => ({ ...prev, teams: prev.teams.filter(t => t.id !== id) }));
      };

      const swapTeams = (id1, id2) => {
        update(prev => {
          const teams = [...prev.teams];
          const i1 = teams.findIndex(t => t.id === id1);
          const i2 = teams.findIndex(t => t.id === id2);
          if (i1 < 0 || i2 < 0) return prev;
          [teams[i1], teams[i2]] = [teams[i2], teams[i1]];
          return { ...prev, teams };
        });
      };

      return (
        <div className="space-y-6">
          <div className="card p-6 rounded-2xl">
            <h3 className="text-lg font-semibold mb-3">افزودن نام تیم‌ها (هر خط یک تیم)</h3>
            <textarea
              value={names}
              onChange={e => setNames(e.target.value)}
              rows={6}
              placeholder={"تیم آ\nتیم ب\nتیم ج"}
              className="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 mb-3"
            />
            <button onClick={addTeams} className="btn-primary px-5 py-2 rounded-xl">افزودن</button>
            <p className="text-sm text-slate-400 mt-2">{data.teams.length} / {data.config.numTeams} تیم</p>
          </div>

          <div className="card p-6 rounded-2xl">
            <h3 className="text-lg font-semibold mb-4">لیست تیم‌ها و لوگو</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {data.teams.map((t, idx) => (
                <div key={t.id} className="flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 border border-slate-700">
                  <span className="text-slate-500 w-6">{idx + 1}</span>
                  {t.logo ? (
                    <img src={t.logo} alt="" className="logo-preview" />
                  ) : (
                    <div className="logo-preview flex items-center justify-center text-slate-500 text-xs">بدون لوگو</div>
                  )}
                  <div className="flex-1 min-w-0">
                    <input
                      value={t.name}
                      onChange={e => update(prev => ({
                        ...prev,
                        teams: prev.teams.map(x => x.id === t.id ? { ...x, name: e.target.value } : x)
                      }))}
                      className="w-full bg-transparent border-b border-slate-600 focus:border-blue-500 outline-none py-1"
                    />
                    <label className="text-xs text-blue-400 cursor-pointer mt-1 block">
                      آپلود لوگو
                      <input type="file" accept="image/*" className="hidden" onChange={e => handleLogo(t.id, e.target.files[0])} />
                    </label>
                  </div>
                  <button onClick={() => removeTeam(t.id)} className="text-red-400 hover:text-red-300 text-sm">حذف</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function DrawTab() {
      const { data, update } = useTournament();

      const doDraw = () => {
        if (data.teams.length < data.config.numTeams) {
          alert("تعداد تیم‌ها کامل نیست");
          return;
        }
        const shuffled = [...data.teams].sort(() => Math.random() - 0.5);
        const groups = [];
        const teamsPerGroup = data.config.teamsPerGroup;
        for (let i = 0; i < data.config.numGroups; i++) {
          const groupTeams = shuffled.slice(i * teamsPerGroup, (i + 1) * teamsPerGroup);
          const groupId = `G${i + 1}`;
          groups.push({ id: groupId, name: `گروه ${String.fromCharCode(65 + i)}` });
          groupTeams.forEach(t => { t.groupId = groupId; });
        }
        // Generate group matches (round-robin)
        const matches = [];
        groups.forEach(g => {
          const gTeams = shuffled.filter(t => t.groupId === g.id);
          for (let i = 0; i < gTeams.length; i++) {
            for (let j = i + 1; j < gTeams.length; j++) {
              matches.push({
                id: generateId(),
                team1Id: gTeams[i].id,
                team2Id: gTeams[j].id,
                score1: null,
                score2: null,
                groupId: g.id,
                stage: "group",
                date: "",
                time: ""
              });
            }
          }
        });
        update(prev => ({
          ...prev,
          teams: shuffled,
          groups,
          matches,
          stage: "groups"
        }));
        alert("قرعه‌کشی انجام شد و بازی‌های گروهی ساخته شد.");
      };

      const swapInGroup = (teamId, targetGroupId) => {
        update(prev => {
          const teams = prev.teams.map(t => t.id === teamId ? { ...t, groupId: targetGroupId } : t);
          return { ...prev, teams };
        });
      };

      return (
        <div className="space-y-6">
          <div className="card p-6 rounded-2xl">
            <h3 className="text-lg font-semibold mb-3">قرعه‌کشی گروه‌ها</h3>
            <p className="text-sm text-slate-400 mb-4">تیم‌ها به صورت تصادفی در گروه‌ها قرار می‌گیرند و بازی‌های رفت‌وبرگشتی (round-robin) ساخته می‌شود.</p>
            <button onClick={doDraw} className="btn-success px-6 py-2.5 rounded-xl font-medium">انجام قرعه‌کشی</button>
          </div>

          {data.groups.length > 0 && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {data.groups.map(g => {
                const gTeams = data.teams.filter(t => t.groupId === g.id);
                return (
                  <div key={g.id} className="card p-4 rounded-xl">
                    <h4 className="font-bold text-blue-300 mb-3">{g.name}</h4>
                    <ul className="space-y-2">
                      {gTeams.map(t => (
                        <li key={t.id} className="flex items-center gap-2 text-sm">
                          {t.logo && <img src={t.logo} className="w-6 h-6 rounded" />}
                          <span>{t.name}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                );
              })}
            </div>
          )}

          {data.groups.length > 0 && (
            <div className="card p-6 rounded-2xl">
              <h3 className="text-lg font-semibold mb-3">جابجایی تیم بین گروه‌ها</h3>
              <p className="text-sm text-slate-400 mb-3">برای جابجایی دستی، تیم را انتخاب و گروه جدید را مشخص کنید (در نسخه بعدی کامل‌تر می‌شود).</p>
              <div className="text-sm text-slate-300">
                فعلاً بعد از قرعه می‌توانید نتایج را ثبت کنید. برای جابجایی دقیق‌تر، از تب تیم‌ها نام را ویرایش کنید یا دوباره قرعه بزنید.
              </div>
            </div>
          )}
        </div>
      );
    }

    function ResultsTab() {
      const { data, update } = useTournament();

      const setScore = (matchId, score1, score2) => {
        update(prev => ({
          ...prev,
          matches: prev.matches.map(m =>
            m.id === matchId ? { ...m, score1: score1 === "" ? null : +score1, score2: score2 === "" ? null : +score2 } : m
          )
        }));
      };

      const groupMatches = data.matches.filter(m => m.stage === "group");

      return (
        <div className="space-y-6">
          <div className="card p-6 rounded-2xl">
            <h3 className="text-lg font-semibold mb-4">ثبت نتایج بازی‌های گروهی</h3>
            <p className="text-sm text-slate-400 mb-4">نتیجه به صورت تعداد ست (مثلاً ۲ و ۰ یا ۲ و ۱). هر کس به ۲ ست برسد برنده است.</p>
            {data.groups.map(g => {
              const ms = groupMatches.filter(m => m.groupId === g.id);
              return (
                <div key={g.id} className="mb-6">
                  <h4 className="font-bold text-blue-300 mb-2">{g.name}</h4>
                  <div className="space-y-2">
                    {ms.map(m => {
                      const t1 = data.teams.find(t => t.id === m.team1Id);
                      const t2 = data.teams.find(t => t.id === m.team2Id);
                      return (
                        <div key={m.id} className="flex flex-wrap items-center gap-2 p-3 rounded-lg bg-slate-800/50">
                          <span className="w-28 truncate text-sm">{t1?.name}</span>
                          <input
                            type="number" min="0" max="2"
                            value={m.score1 ?? ""}
                            onChange={e => setScore(m.id, e.target.value, m.score2)}
                            className="w-14 px-2 py-1 rounded bg-slate-900 border border-slate-600 text-center"
                          />
                          <span className="text-slate-500">-</span>
                          <input
                            type="number" min="0" max="2"
                            value={m.score2 ?? ""}
                            onChange={e => setScore(m.id, m.score1, e.target.value)}
                            className="w-14 px-2 py-1 rounded bg-slate-900 border border-slate-600 text-center"
                          />
                          <span className="w-28 truncate text-sm">{t2?.name}</span>
                          {m.date && <span className="text-xs text-slate-500">{m.date} {m.time}</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function ScheduleTab() {
      const { data, update } = useTournament();

      const updateMatchSchedule = (matchId, field, value) => {
        update(prev => ({
          ...prev,
          matches: prev.matches.map(m => m.id === matchId ? { ...m, [field]: value } : m)
        }));
      };

      return (
        <div className="card p-6 rounded-2xl">
          <h3 className="text-lg font-semibold mb-4">برنامه‌ریزی ساعت و روز بازی‌ها</h3>
          <div className="space-y-3 max-h-[60vh] overflow-y-auto">
            {data.matches.map(m => {
              const t1 = data.teams.find(t => t.id === m.team1Id)?.name || "?";
              const t2 = data.teams.find(t => t.id === m.team2Id)?.name || "?";
              return (
                <div key={m.id} className="flex flex-wrap items-center gap-3 p-3 rounded-lg bg-slate-800/50 text-sm">
                  <span className="w-40 truncate">{t1} vs {t2}</span>
                  <input
                    type="date"
                    value={m.date || ""}
                    onChange={e => updateMatchSchedule(m.id, "date", e.target.value)}
                    className="px-2 py-1 rounded bg-slate-900 border border-slate-600"
                  />
                  <input
                    type="time"
                    value={m.time || ""}
                    onChange={e => updateMatchSchedule(m.id, "time", e.target.value)}
                    className="px-2 py-1 rounded bg-slate-900 border border-slate-600"
                  />
                  <span className="text-xs text-slate-500">{m.stage === "group" ? "گروهی" : "حذفی"}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function KnockoutAdminTab() {
      const { data, update } = useTournament();

      const computeAdvance = () => {
        const { config, teams, matches, groups } = data;
        const allSeconds = [];
        const advanced = [];

        groups.forEach(g => {
          const standings = calcStandings(teams, matches, g.id);
          // top advancePerGroup
          for (let i = 0; i < config.advancePerGroup && i < standings.length; i++) {
            advanced.push({ ...standings[i].team, fromGroup: g.id, rank: i + 1 });
          }
          // collect seconds
          if (standings.length > config.advancePerGroup) {
            allSeconds.push({ ...standings[config.advancePerGroup].team, fromGroup: g.id, stats: standings[config.advancePerGroup] });
          }
        });

        // best seconds by points then setDiff
        allSeconds.sort((a, b) => {
          if (b.stats.points !== a.stats.points) return b.stats.points - a.stats.points;
          if (b.stats.setDiff !== a.stats.setDiff) return b.stats.setDiff - a.stats.setDiff;
          return b.stats.setsWon - a.stats.setsWon;
        });

        const bestSecs = allSeconds.slice(0, config.bestSeconds).map(s => ({ ...s, rank: "best2nd" }));
        const final12 = [...advanced, ...bestSecs];

        // Create round of 12 matches (placeholder pairing: 1vs12, 2vs11 ...)
        const r12 = [];
        for (let i = 0; i < 6; i++) {
          const t1 = final12[i];
          const t2 = final12[11 - i];
          if (t1 && t2) {
            r12.push({
              id: generateId(),
              team1Id: t1.id,
              team2Id: t2.id,
              score1: null,
              score2: null,
              stage: "r12",
              date: "",
              time: ""
            });
          }
        }

        update(prev => ({
          ...prev,
          knockout: {
            ...prev.knockout,
            roundOf12: r12,
            advancedFromGroups: final12
          },
          matches: [...prev.matches.filter(m => m.stage === "group"), ...r12],
          stage: "knockout"
        }));
        alert("۱۲ تیم صعودکننده مشخص و بازی‌های دور ۱۲ تیمی ساخته شد.");
      };

      // Further rounds: after r12, winners + best 2 losers by sets -> 8 teams for quarters
      const advanceToQuarter = () => {
        const r12 = data.matches.filter(m => m.stage === "r12" && m.score1 !== null);
        if (r12.length < 6) {
          alert("همه بازی‌های دور ۱۲ تیمی را ثبت کنید");
          return;
        }
        const winners = [];
        const losers = [];
        r12.forEach(m => {
          const t1 = data.teams.find(t => t.id === m.team1Id);
          const t2 = data.teams.find(t => t.id === m.team2Id);
          if (m.score1 > m.score2) {
            winners.push(t1);
            losers.push({ team: t2, setsWon: m.score2, setsLost: m.score1, setDiff: m.score2 - m.score1 });
          } else {
            winners.push(t2);
            losers.push({ team: t1, setsWon: m.score1, setsLost: m.score2, setDiff: m.score1 - m.score2 });
          }
        });
        losers.sort((a, b) => b.setDiff - a.setDiff || b.setsWon - a.setsWon);
        const bestLosers = losers.slice(0, 2).map(l => l.team);
        const eight = [...winners, ...bestLosers];

        const quarters = [];
        for (let i = 0; i < 4; i++) {
          quarters.push({
            id: generateId(),
            team1Id: eight[i].id,
            team2Id: eight[7 - i].id,
            score1: null,
            score2: null,
            stage: "quarter",
            date: "",
            time: ""
          });
        }

        update(prev => ({
          ...prev,
          knockout: { ...prev.knockout, quarter: quarters, advancedFromLosers: bestLosers },
          matches: [...prev.matches.filter(m => !["quarter", "semi", "third", "final"].includes(m.stage)), ...quarters]
        }));
        alert("۸ تیم مشخص و یک‌چهارم نهایی ساخته شد.");
      };

      const advanceToSemi = () => {
        const qs = data.matches.filter(m => m.stage === "quarter" && m.score1 !== null);
        if (qs.length < 4) { alert("همه بازی‌های یک‌چهارم را ثبت کنید"); return; }
        const winners = qs.map(m => m.score1 > m.score2 ? m.team1Id : m.team2Id);
        const semis = [
          { id: generateId(), team1Id: winners[0], team2Id: winners[1], score1: null, score2: null, stage: "semi", date: "", time: "" },
          { id: generateId(), team1Id: winners[2], team2Id: winners[3], score1: null, score2: null, stage: "semi", date: "", time: "" }
        ];
        update(prev => ({
          ...prev,
          matches: [...prev.matches.filter(m => !["semi", "third", "final"].includes(m.stage)), ...semis]
        }));
        alert("نیمه‌نهایی ساخته شد.");
      };

      const makeFinalAndThird = () => {
        const semis = data.matches.filter(m => m.stage === "semi" && m.score1 !== null);
        if (semis.length < 2) { alert("نتایج نیمه‌نهایی را ثبت کنید"); return; }
        const finalists = [];
        const thirdists = [];
        semis.forEach(m => {
          if (m.score1 > m.score2) {
            finalists.push(m.team1Id);
            thirdists.push(m.team2Id);
          } else {
            finalists.push(m.team2Id);
            thirdists.push(m.team1Id);
          }
        });
        const final = { id: generateId(), team1Id: finalists[0], team2Id: finalists[1], score1: null, score2: null, stage: "final", date: "", time: "" };
        const third = { id: generateId(), team1Id: thirdists[0], team2Id: thirdists[1], score1: null, score2: null, stage: "third", date: "", time: "" };
        update(prev => ({
          ...prev,
          matches: [...prev.matches.filter(m => !["final", "third"].includes(m.stage)), final, third],
          stage: "finished"
        }));
        alert("فینال و رده‌بندی ساخته شد.");
      };

      return (
        <div className="space-y-6">
          <div className="card p-6 rounded-2xl space-y-4">
            <h3 className="text-lg font-semibold">مدیریت دور حذفی</h3>
            <button onClick={computeAdvance} className="btn-primary px-5 py-2 rounded-xl ml-2">محاسبه ۱۲ تیم صعودکننده + ساخت دور ۱۲ تیمی</button>
            <button onClick={advanceToQuarter} className="btn-success px-5 py-2 rounded-xl ml-2">از دور ۱۲ → ۸ تیم (با بهترین بازنده‌ها) + یک‌چهارم</button>
            <button onClick={advanceToSemi} className="btn-primary px-5 py-2 rounded-xl ml-2">ساخت نیمه‌نهایی</button>
            <button onClick={makeFinalAndThird} className="btn-success px-5 py-2 rounded-xl">ساخت فینال و رده‌بندی</button>
          </div>

          <div className="card p-6 rounded-2xl">
            <h3 className="text-lg font-semibold mb-3">ثبت نتایج حذفی</h3>
            {["r12", "quarter", "semi", "third", "final"].map(stage => {
              const ms = data.matches.filter(m => m.stage === stage);
              if (ms.length === 0) return null;
              const titles = { r12: "دور ۱۲ تیمی", quarter: "یک‌چهارم نهایی", semi: "نیمه‌نهایی", third: "رده‌بندی", final: "فینال" };
              return (
                <div key={stage} className="mb-4">
                  <h4 className="font-bold text-amber-300 mb-2">{titles[stage]}</h4>
                  {ms.map(m => {
                    const t1 = data.teams.find(t => t.id === m.team1Id);
                    const t2 = data.teams.find(t => t.id === m.team2Id);
                    return (
                      <div key={m.id} className="flex items-center gap-2 p-2 rounded bg-slate-800/50 mb-1">
                        <span className="w-32 truncate text-sm">{t1?.name}</span>
                        <input type="number" min="0" max="2" value={m.score1 ?? ""} onChange={e => {
                          update(prev => ({
                            ...prev,
                            matches: prev.matches.map(x => x.id === m.id ? { ...x, score1: e.target.value === "" ? null : +e.target.value } : x)
                          }));
                        }} className="w-12 px-1 py-1 rounded bg-slate-900 border border-slate-600 text-center" />
                        <span>-</span>
                        <input type="number" min="0" max="2" value={m.score2 ?? ""} onChange={e => {
                          update(prev => ({
                            ...prev,
                            matches: prev.matches.map(x => x.id === m.id ? { ...x, score2: e.target.value === "" ? null : +e.target.value } : x)
                          }));
                        }} className="w-12 px-1 py-1 rounded bg-slate-900 border border-slate-600 text-center" />
                        <span className="w-32 truncate text-sm">{t2?.name}</span>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function ExportTab() {
      const { data, update } = useTournament();

      const exportJson = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "golbahar-tournament-backup.json";
        a.click();
      };

      const importJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            update(parsed);
            alert("داده با موفقیت وارد شد");
          } catch {
            alert("فایل نامعتبر است");
          }
        };
        reader.readAsText(file);
      };

      const resetAll = () => {
        if (confirm("همه داده‌ها پاک شود؟")) {
          update(getDefaultData());
        }
      };

      return (
        <div className="card p-6 rounded-2xl space-y-4">
          <h3 className="text-lg font-semibold">پشتیبان‌گیری و بازیابی</h3>
          <p className="text-sm text-slate-400">
            چون داده‌ها در مرورگر ذخیره می‌شوند (localStorage)، برای اشتراک‌گذاری بین دستگاه‌ها یا کاربران، فایل JSON را export کنید و در دستگاه دیگر import کنید.
            برای استفاده واقعی چندکاربره، می‌توانید بعداً به Firebase وصل کنید.
          </p>
          <div className="flex flex-wrap gap-3">
            <button onClick={exportJson} className="btn-primary px-5 py-2 rounded-xl">دانلود پشتیبان JSON</button>
            <label className="btn-success px-5 py-2 rounded-xl cursor-pointer">
              بارگذاری پشتیبان
              <input type="file" accept=".json" className="hidden" onChange={importJson} />
            </label>
            <button onClick={resetAll} className="btn-danger px-5 py-2 rounded-xl">ریست کامل</button>
          </div>
        </div>
      );
    }

    // ==================== PUBLIC PAGES ====================
    function PublicHome() {
      const { data } = useTournament();

      return (
        <div className="max-w-6xl mx-auto px-4 py-6 space-y-8">
          <div className="text-center mb-8">
            <h2 className="text-3xl font-bold mb-2">🏐 مسابقات والیبال گلبهار</h2>
            <p className="text-slate-400">وضعیت فعلی: {data.stage === "setup" ? "در حال آماده‌سازی" : data.stage === "groups" ? "مرحله گروهی" : data.stage === "knockout" ? "مرحله حذفی" : "پایان یافته"}</p>
          </div>

          {data.groups.length > 0 && (
            <section>
              <h3 className="text-xl font-bold mb-4 text-blue-300">جدول گروه‌ها</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {data.groups.map(g => {
                  const standings = calcStandings(data.teams, data.matches, g.id);
                  return (
                    <div key={g.id} className="card rounded-xl overflow-hidden">
                      <div className="bg-blue-900/40 px-4 py-2 font-bold">{g.name}</div>
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="text-slate-400 text-xs border-b border-slate-700">
                            <th className="py-2 pr-2 text-right">تیم</th>
                            <th className="py-2">بازی</th>
                            <th className="py-2">برد</th>
                            <th className="py-2">ست</th>
                            <th className="py-2">امتیاز</th>
                          </tr>
                        </thead>
                        <tbody>
                          {standings.map((s, i) => (
                            <tr key={s.team.id} className={`border-b border-slate-800 ${i < data.config.advancePerGroup ? "bg-green-900/20" : ""}`}>
                              <td className="py-2 pr-2 flex items-center gap-2">
                                {s.team.logo && <img src={s.team.logo} className="w-5 h-5 rounded" />}
                                <span className="truncate max-w-[100px]">{s.team.name}</span>
                              </td>
                              <td className="text-center">{s.played}</td>
                              <td className="text-center">{s.wins}</td>
                              <td className="text-center">{s.setsWon}-{s.setsLost}</td>
                              <td className="text-center font-bold text-amber-300">{s.points}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  );
                })}
              </div>
            </section>
          )}

          <section>
            <h3 className="text-xl font-bold mb-4 text-amber-300">نتایج و برنامه بازی‌ها</h3>
            <div className="card rounded-xl p-4 max-h-[50vh] overflow-y-auto">
              {data.matches.length === 0 ? (
                <p className="text-slate-500 text-center py-8">هنوز بازی‌ای ثبت نشده</p>
              ) : (
                <div className="space-y-2">
                  {data.matches.map(m => {
                    const t1 = data.teams.find(t => t.id === m.team1Id);
                    const t2 = data.teams.find(t => t.id === m.team2Id);
                    const played = m.score1 !== null && m.score2 !== null;
                    return (
                      <div key={m.id} className="flex flex-wrap items-center justify-between gap-2 p-3 rounded-lg bg-slate-800/40 text-sm">
                        <div className="flex items-center gap-2 min-w-0">
                          {t1?.logo && <img src={t1.logo} className="w-6 h-6 rounded" />}
                          <span className="truncate w-24">{t1?.name || "?"}</span>
                          <span className={`font-mono font-bold ${played ? "text-white" : "text-slate-500"}`}>
                            {played ? `${m.score1} - ${m.score2}` : "vs"}
                          </span>
                          <span className="truncate w-24">{t2?.name || "?"}</span>
                          {t2?.logo && <img src={t2.logo} className="w-6 h-6 rounded" />}
                        </div>
                        <div className="text-xs text-slate-400">
                          {m.date && <span>{m.date} </span>}
                          {m.time && <span>{m.time} </span>}
                          <span className="bg-slate-700 px-2 py-0.5 rounded">{m.stage === "group" ? "گروهی" : m.stage}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>

          {data.knockout?.advancedFromGroups?.length > 0 && (
            <section>
              <h3 className="text-xl font-bold mb-4 text-green-300">تیم‌های صعودکننده به حذفی</h3>
              <div className="flex flex-wrap gap-3">
                {data.knockout.advancedFromGroups.map((t, i) => (
                  <div key={t.id || i} className="card px-4 py-2 rounded-xl flex items-center gap-2">
                    {t.logo && <img src={t.logo} className="w-8 h-8 rounded" />}
                    <span>{t.name}</span>
                    <span className="text-xs text-slate-400">({t.rank === "best2nd" ? "بهترین دوم" : `رتبه ${t.rank}`})</span>
                  </div>
                ))}
              </div>
            </section>
          )}
        </div>
      );
    }

    // ==================== APP ====================
    function App() {
      return (
        <TournamentProvider>
          <BrowserRouter>
            <Header />
            <Routes>
              <Route path="/" element={<PublicHome />} />
              <Route path="/admin-login" element={<AdminLogin />} />
              <Route path="/admin" element={<AdminPanel />} />
              <Route path="*" element={<Navigate to="/" />} />
            </Routes>
          </BrowserRouter>
        </TournamentProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
