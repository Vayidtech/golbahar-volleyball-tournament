<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقات والیبال گلبهار</title>
</head>
<body style="font-family:Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8fafc">
<div id="boot" style="text-align:center;color:#64748b">
<div style="width:40px;height:40px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite"></div>
در حال بارگذاری...
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
(async function () {
  var URL = 'https://crudcrud.com/api/31ee9f3211594237b3da1bdfebd4167d/page/6aaa92508668fb03e862b9d3';
  try {
    var res = await fetch(URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var html = data.html;
    if (!html) throw new Error('empty page');

    // Ensure app boots even if DOMContentLoaded already fired
    var bootInject = "<script>(function(){function go(){try{if(typeof initApp==='function')initApp();}catch(e){console.error(e);}setTimeout(function(){var L=document.getElementById('app-loading');if(L){L.style.opacity='0';setTimeout(function(){L.style.display='none';},200);}},300);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();})();<\/script>";
    if (html.indexOf('</body>') !== -1) html = html.replace('</body>', bootInject + '</body>');
    else html += bootInject;

    if (location.hash === '#admin' && sessionStorage.getItem('golbahar_admin_ok') === '1') {
      html = html.replace('</body>',
        '<script>setTimeout(function(){try{isAdminLoggedIn=true;var p=document.getElementById("view-public");var a=document.getElementById("view-admin");if(p)p.classList.add("hidden");if(a)a.classList.remove("hidden");}catch(e){}},900);<\/script></body>');
    }

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('boot').innerHTML =
      '<div style="color:#e11d48;font-weight:bold;margin-bottom:8px">خطا در بارگذاری</div>' +
      '<div style="font-size:12px;margin-bottom:12px">' + e.message + '</div>' +
      '<button onclick="location.reload()" style="padding:8px 16px;background:#059669;color:#fff;border:0;border-radius:8px;cursor:pointer">تلاش مجدد</button>';
  }
})();
</script>
</body>
</html>
